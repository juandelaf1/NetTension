# NetTension — Data Sources Catalog & Governance
# Compliant with DEC-007 (4-tier classification) and DEC-008 (governance metadata)
#
# Governance Layers:
#   OBSERVED       — Directly measured, auditable source data
#   ESTIMATED      — Derived from observed data with transparent assumptions
#   POLICY_MODEL   — Scenario/forecast under explicit policy assumptions
#   CONSTANT       — Fixed parameters (inflation, thresholds, etc.)

# =============================================================================
# LAYER 1: OBSERVED — CNMC (Spain, 2005–2025)
# =============================================================================

CNMC Mercados:
  governance_layer: OBSERVED
  confidence_level: HIGH
  review_date: 2025-12
  review_owner: CNMC (Comisión Nacional de los Mercados y la Competencia)
  source_type: PUBLIC_REGULATOR
  reproducible: TRUE
  documentation_reference: https://catalogodatos.cnmc.es/dataset/mercados
  url: "https://catalogodatos.cnmc.es/dataset/mercados"
  license: CC-BY-SA-4.0
  coverage:
    geography: Spain
    period: 2005T1–2025T4
    granularity: Operator-level quarterly
  files:
    - cnmc_mercados_2005_2009.csv (7,809 rows, 49 cols)
    - cnmc_mercados_2010_2014.csv (10,397 rows, 49 cols)
    - cnmc_mercados_2015_2019.csv (10,807 rows, 49 cols)
    - cnmc_mercados_2020_2024.csv (10,900 rows, 49 cols)
    - cnmc_mercados_2025T1_2025T4.csv (2,024 rows, 49 cols)
  total_rows: 41,937
  key_variables:
    - ingresos (revenue, Mn EUR)
    - trafico (voice traffic, minutes)
    - trafico_de_datos (data traffic, GB/TB)
    - lineas_o_accesos_por_operador (active lines by operator)
    - portabilidades (number portings)
    - tecnologia_de_acceso (FTTH, xDSL, HFC, mobile)
  encoding: UTF-8 (confirmed by byte analysis)
  notes: "trafico column = voice minutes only. Data traffic in trafico_de_datos. Methodology change ~2012 in data traffic measurement."

CNMC Datos Generales:
  governance_layer: OBSERVED
  confidence_level: HIGH
  review_date: 2025-12
  review_owner: CNMC
  source_type: PUBLIC_REGULATOR
  reproducible: TRUE
  documentation_reference: https://catalogodatos.cnmc.es/dataset/datos-generales
  url: "https://catalogodatos.cnmc.es/dataset/datos-generales"
  license: CC-BY-SA-4.0
  coverage:
    geography: Spain
    period: 2005T1–2025T4
    granularity: Operator-level quarterly
  file: cnmc_datos_generales_2005T1_2025T4.csv (3,319 rows, 14 cols)
  key_variables:
    - ingresos_por_operador (revenue by operator, Mn EUR)
    - empleados_por_operador (employees by operator)
    - paquetes (bundled services)
  encoding: UTF-8

