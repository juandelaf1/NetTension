# =============================================================================
# LAYER 1: OBSERVED — ETNO State of Digital Communications 2025
# =============================================================================

ETNO State of Digital Communications 2025:
  governance_layer: OBSERVED
  confidence_level: HIGH
  review_date: 2025-01
  review_owner: Connect Europe (formerly ETNO)
  source_type: INDUSTRY_ASSOCIATION
  reproducible: TRUE
  documentation_reference: https://connecteurope.org/insights/reports/state-digital-communications-2025
  url: "https://connecteurope.org/sites/default/files/2025-01/State%20of%20Digital%20Communications%20-%202025%20edition.pdf"
  license: PUBLIC (free download)
  coverage:
    geography: Europe (EU27 + UK + NO + CH)
    period: 2015–2024
  file: ETNO_State_Digital_Comms_2025.pdf
  key_findings:
    - Operator CAPEX Europe: €57.9bn (2023), declining
    - Investment per capita: Europe €118 vs USA €226
    - Mobile ARPU: Europe €14.8 vs USA €41.7
    - Revenue decline: -4.4% real (2023)
    - ROCE: 5.9% (2023), below cost of capital since 2018
    - 46% of investment → FTTH, ~30% → mobile
  notes: "Primary source for European telecom investment gap evidence."

