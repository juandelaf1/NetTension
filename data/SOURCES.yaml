  notes: "Key regulatory counterpoint to operator Fair Share claims."

# =============================================================================
# LAYER 2: ESTIMATED — KPI Derivatives
# =============================================================================

HHI (Herfindahl-Hirschman Index):
  governance_layer: ESTIMATED
  confidence_level: HIGH
  review_date: 2025-12
  review_owner: NetTension
  source_type: DERIVED
  reproducible: TRUE
  documentation_reference: kpi_engine.py::hhi_quarterly()
  formula: "HHI = sum(cuota_i^2) * 10000"
  input_sources: [CNMC Mercados -> ingresos_por_operador]
  coverage:
    geography: Spain
    period: 2005T1–2025T4
  classification:
    competitive: "<1000"
    moderate: "1000–2500"
    highly_concentrated: ">2500"
  observed_range: [693, 2405]

Network Stress Index (NSI):
  governance_layer: ESTIMATED
  confidence_level: MEDIUM
  review_date: 2025-12
  review_owner: NetTension
  source_type: DERIVED
  reproducible: TRUE
  documentation_reference: kpi_engine.py::network_stress_index()
  formula: "NSI = total_traffic / total_active_lines"
  input_sources: [CNMC Mercados -> trafico_de_datos, lineas_o_accesos]
  notes: "Uses trafico_de_datos (data traffic), not trafico (voice minutes)."

Infrastructure Elasticity Margin:
  governance_layer: ESTIMATED
  confidence_level: MEDIUM
  review_date: 2025-12
  review_owner: NetTension
  source_type: DERIVED
  reproducible: TRUE
  documentation_reference: kpi_engine.py::infrastructure_elasticity_margin()
  formula: "revenue_per_traffic_unit = total_revenue / total_data_traffic"
  input_sources: [CNMC Mercados -> ingresos, trafico_de_datos]
  notes: "Falling values indicate margin compression = scissors effect."

CAGR Gap (Traffic vs Revenue):
  governance_layer: ESTIMATED
  confidence_level: MEDIUM
  review_date: 2025-12
  review_owner: NetTension
  source_type: DERIVED
  reproducible: TRUE
  documentation_reference: kpi_engine.py::traffic_vs_revenue_cagr()
  formula: "CAGR_gap = CAGR(traffic) - CAGR(revenue)"
  input_sources: [CNMC Mercados -> trafico_de_datos, ingresos]
  observed_value:
    traffic_cagr: 132.6
    revenue_cagr: 0.56
    gap_pp: 132.0
    period: 2005–2025
  notes: "Data traffic CAGR pre-2012 inflated by methodology change. Post-2012 CAGR ~73%/year."

Macro Contribution Ratio:
  governance_layer: ESTIMATED
  confidence_level: HIGH
  review_date: 2025-12
  review_owner: NetTension
  source_type: DERIVED
  reproducible: TRUE
  documentation_reference: kpi_engine.py::macro_contribution_ratio()
  formula: "MCR = total_telecom_revenue / GDP"
  input_sources: [CNMC Datos Generales -> ingresos, Eurostat -> nama_10_gdp]

Digital Density Margin:
  governance_layer: ESTIMATED
  confidence_level: HIGH
  review_date: 2025-12
  review_owner: NetTension
  source_type: DERIVED
  reproducible: TRUE
  documentation_reference: kpi_engine.py::digital_density_margin()
  formula: "DDM = active_lines / population * 100"
  input_sources: [CNMC Mercados -> lineas_o_accesos, Eurostat -> demo_pjan]

# =============================================================================
# LAYER 3: POLICY_MODEL — What-If Scenarios
# =============================================================================

Fair Share Simulator:
  governance_layer: POLICY_MODEL
  confidence_level: LOW (scenario-dependent)
  review_date: 2025-12
  review_owner: NetTension
  source_type: SCENARIO_MODEL
  reproducible: TRUE
  documentation_reference: Power BI What-If parameters
  formula: "CAPEX_relief = CAPEX_required * OTT_contribution_share"
  assumptions:
    - OTT contribution share: 0% (status quo), 25%, 33%, 50%
    - CAPEX_required derived from ETNO report (€174bn by 2030)
  input_sources: [ETNO State of Digital Comms 2025]
  notes: "Illustrates financial impact of Fair Share regulation scenarios."

Chinese Infrastructure Risk Trade-off:
  governance_layer: POLICY_MODEL
  confidence_level: LOW
  review_date: 2025-12
  review_owner: NetTension
  source_type: SCENARIO_MODEL
  reproducible: PARTIAL (dependent on vendor data)
  documentation_reference: Power BI model
  key_variables:
    - huawei_share_pct (by country)
    - cost_savings_pct (Huawei 20-30% cheaper vs Ericsson/Nokia)
    - security_risk_score (qualitative, based on EU 5G Toolbox)
  input_sources:
    - Strand Consult (via Light Reading)
    - EU 5G Observatory 2025
    - GSMA Mobile Economy Europe 2025
  notes: "Trade-off model: lower CAPEX vs higher geopolitical risk."

