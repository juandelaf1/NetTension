# =============================================================================

BEREC IP Interconnection Report 2025:
  governance_layer: OBSERVED
  confidence_level: HIGH
  review_date: 2025-01
  review_owner: BEREC (Body of European Regulators for Electronic Communications)
  source_type: REGULATORY_BODY
  reproducible: TRUE
  documentation_reference: https://www.berec.europa.eu/en/document-categories/berec/reports/berec-report-on-the-ip-interconnection-ecosystem
  url: "https://www.berec.europa.eu/system/files/2025-01/BoR%20%2824%29%20177_BEREC%20Report%20on%20the%20IP-IC%20ecosystem_0.pdf"
  license: PUBLIC (free download)
