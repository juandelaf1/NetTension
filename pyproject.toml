[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nettension"
version = "0.1.0"
description = "EU Telecoms Market & Network Stress Model"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "mypy",
    "jupyter",
    "nbconvert",
]
test = [
    "pytest>=7",
    "pytest-cov",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
