<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#00bcd4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ff6b35;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Trend lines illustration -->
  <polyline points="50,250 200,240 350,230 500,200 650,150 800,80 950,60 1100,50"
            fill="none" stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <polyline points="50,230 200,225 350,220 500,218 650,215 800,212 950,210 1100,208"
            fill="none" stroke="#ff6b35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- Gap arrow -->
  <line x1="650" y1="148" x2="650" y2="213" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Title -->
  <text x="80" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="2">NetTension</text>

  <!-- Subtitle -->
  <text x="80" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="300" fill="#aabbcc" letter-spacing="1">EU Telecom Network Stress Simulation Framework</text>

  <!-- Tagline -->
  <text x="80" y="190" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8899aa" letter-spacing="0.5">CNMC + Eurostat · 2005–2025 · Fair Share · Regulatory Crossroads</text>

  <!-- Accent line -->
  <rect x="80" y="205" width="120" height="3" rx="2" fill="url(#accent)"/>

  <!-- Legend box -->
  <rect x="80" y="228" width="12" height="12" rx="2" fill="#00bcd4" opacity="0.7"/>
  <text x="98" y="239" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8899aa">Traffic</text>
  <rect x="160" y="228" width="12" height="12" rx="2" fill="#ff6b35" opacity="0.7"/>
  <text x="178" y="239" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8899aa">Revenue</text>

  <!-- Stats boxes -->
  <g transform="translate(750, 60)">
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8899aa" letter-spacing="1">CAGR TRAFFIC</text>
    <text y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#00bcd4">+127%</text>
    <text y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#667788">per year (2005–2025)</text>
  </g>
  <g transform="translate(750, 130)">
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8899aa" letter-spacing="1">CAGR REVENUE</text>
    <text y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#ff6b35">-0.4%</text>
    <text y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#667788">per year (2005–2025)</text>
  </g>
  <g transform="translate(750, 200)">
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8899aa" letter-spacing="1">HHI RANGE</text>
    <text y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">1,903–3,538</text>
    <text y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#667788">Moderately → Highly Concentrated</text>
  </g>

  <!-- Version badge -->
  <rect x="80" y="260" width="80" height="22" rx="4" fill="#00bcd4" opacity="0.15"/>
  <text x="120" y="275" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00bcd4" text-anchor="middle" font-weight="600">v1.0.0</text>
</svg>
